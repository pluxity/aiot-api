server:
  port: ${SERVER_PORT:8080}
  servlet:
    context-path: /
  forward-headers-strategy: framework
spring:
  servlet:
    multipart:
      max-file-size: 1GB
      max-request-size: 1GB
  jpa:
    properties:
      hibernate:
        format_sql: true
    open-in-view: false
jwt:
  access-token:
    name: AccessToken
    secret: +iBcUJRWGvl+94+ow4nXV1fzWIq4rph8x7MyRmrtWio=
    # Duration 표기(예: 30m, 10h, 10d). 단위 없는 숫자는 ms로 해석된다.
    expiration: 10h
  refresh-token:
    name: RefreshToken
    secret: gtzRlqF6bIkmOi5i15A9G5xbLdwiAMmZi6JPOeemC1E=
    expiration: 10d

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
  show-actuator: false
  packages-to-scan: com.pluxity
  default-consumes-media-type: application/json
  default-produces-media-type: application/json

user:
  init-password: qwer1234

llm:
  api:
    base-url: ${LLM_API_BASE_URL:http://192.168.10.181:8000}